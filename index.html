    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #05080f;
            color: #f5f5f5;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Electric Clouds, Rain & Lightning Background Animation */
        .electric-bg {
            position: absolute;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 20%, #0d1b2a 0%, #05080f 70%),
                        radial-gradient(circle at 20% 80%, #0f2c59 0%, transparent 50%),
                        radial-gradient(circle at 80% 90%, #1b263b 0%, transparent 50%);
            overflow: hidden;
        }
        .cloud-fx {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(ellipse at center, rgba(46,166,255,0.08) 0%, rgba(0,0,0,0) 70%);
            animation: cloudMove 20s infinite linear alternate;
        }
        
        /* Lightning Flash Effect */
        .lightning-fx {
            position: absolute;
            inset: 0;
            background: transparent;
            opacity: 0;
            animation: lightningFlash 6s infinite;
            pointer-events: none;
        }
        @keyframes cloudMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(5%, 5%) rotate(5deg); }
        }
        @keyframes lightningFlash {
            0%, 85%, 89%, 95%, 100% { opacity: 0; background: transparent; }
            87%, 92% { opacity: 0.25; background: rgba(255, 255, 255, 0.4); }
        }

        /* Rain Effect */
        .rain-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }
        .raindrop {
            position: absolute;
            background: linear-gradient(transparent, rgba(46, 166, 255, 0.6));
            width: 1px;
            height: 20px;
            opacity: 0.7;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-20px); }
            100% { transform: translateY(102vh); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(46, 166, 255, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(46, 166, 255, 0.6); }

        .glass-panel {
            background: rgba(23, 33, 43, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(46, 166, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card {
            background: rgba(18, 26, 36, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(46, 166, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(46, 166, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(46, 166, 255, 0.6);
            box-shadow: 0 6px 25px rgba(46, 166, 255, 0.25), inset 0 0 15px rgba(46, 166, 255, 0.1);
        }

        @keyframes borderGlow {
            0% { border-color: rgba(46, 166, 255, 0.3); box-shadow: 0 0 5px rgba(46, 166, 255, 0.1); }
            50% { border-color: rgba(46, 166, 255, 0.9); box-shadow: 0 0 20px rgba(46, 166, 255, 0.5); }
            100% { border-color: rgba(46, 166, 255, 0.3); box-shadow: 0 0 5px rgba(46, 166, 255, 0.1); }
        }
        .animate-border-glow { animation: borderGlow 3s infinite ease-in-out; }

        .ripple { position: relative; overflow: hidden; }
        .ripple-effect {
            position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.4);
            transform: scale(0); animation: rippleAnim 0.6s linear; pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

        .typing-dot {
            width: 7px; height: 7px; background: #2ea6ff; border-radius: 50%; display: inline-block;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        @keyframes slideZoomIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes bounceInLeft {
            0% { opacity: 0; transform: translateX(-30px); }
            60% { opacity: 1; transform: translateX(10px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes flipFadeIn {
            0% { opacity: 0; transform: rotateX(-20deg) translateY(15px); }
            100% { opacity: 1; transform: rotateX(0deg) translateY(0); }
        }

        .anim-type-1 { animation: slideZoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .anim-type-2 { animation: bounceInLeft 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-type-3 { animation: flipFadeIn 0.4s ease-out forwards; }

        @keyframes qrPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 166, 255, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(46, 166, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 166, 255, 0); }
        }
        .qr-pulse { animation: qrPulse 2.5s infinite; }
    </style>

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Play music.mp3 once user interacts anywhere
        let musicStarted = false;
        function playBackgroundMusicOnce() {
            if (!musicStarted) {
                const bgMusic = document.getElementById('bg-music');
                if (bgMusic) {
                    bgMusic.volume = 0.5;
                    bgMusic.play().then(() => {
                        musicStarted = true;
                    }).catch(e => console.log("Audio autoplay restricted:", e));
                }
            }
        }

        // Generate Raindrops dynamically
        function createRain() {
            const rainBox = document.getElementById('rain-box');
            if (!rainBox) return;
            for (let i = 0; i < 40; i++) {
                const drop = document.createElement('div');
                drop.className = 'raindrop';
                drop.style.left = `${Math.random() * 100}%`;
                drop.style.top = `${Math.random() * -50}px`;
                drop.style.animationDuration = `${0.6 + Math.random() * 0.8}s`;
                drop.style.animationDelay = `${Math.random() * 2}s`;
                rainBox.appendChild(drop);
            }
        }
        window.addEventListener('DOMContentLoaded', createRain);

        function playTgSound(type = 'click') {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.04);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                } else if (type === 'type') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(800 + Math.random() * 300, now);
                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
                    osc.start(now);
                    osc.stop(now + 0.02);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'screen') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(700, now + 0.06);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                }
            } catch (e) {
                console.warn('Audio feedback error:', e);
            }
        }

        function initializeFirebaseSession() {
            auth.signInAnonymously().then((userCredential) => {
                currentUserUID = userCredential.user.uid;

                console.error("Auth Error:", error);

        const chatContainer = document.getElementById('chat-container');

        function getTimeString() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
            }, 100);
        }

        function appendBotMessage(htmlContent, saveToStorage = true) {
            playTgSound('type');
            const time = getTimeString();
            const animClasses = ['anim-type-1', 'anim-type-2', 'anim-type-3'];
            const randomAnim = animClasses[Math.floor(Math.random() * animClasses.length)];

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-end space-x-2 msg-ai ${randomAnim}`;
            msgDiv.innerHTML = `
                <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-400 flex-shrink-0 flex items-center justify-center shadow-md mb-1">
                    <img src="https://api.iconify.design/lucide:bot.svg?color=%23ffffff" alt="Bot" class="w-4 h-4">

                <div class="glass-panel px-4 py-3 rounded-2xl rounded-bl-sm max-w-[88%] sm:max-w-[75%] border border-blue-500/20 shadow-lg">

                    <div class="flex items-center justify-end space-x-1 mt-1 text-[10px] text-gray-400">
                        <span>${time}</span>
                        <i class="fa-solid fa-check text-blue-400"></i>

            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            if (saveToStorage) saveChatHistoryState();

        function appendUserMessage(textOrHtml, saveToStorage = true) {
            playTgSound('click');
            const time = getTimeString();
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-end justify-end space-x-2 msg-user anim-type-1`;
            msgDiv.innerHTML = `
                <div class="bg-gradient-to-r from-blue-600 to-blue-500 text-white px-4 py-3 rounded-2xl rounded-br-sm max-w-[88%] sm:max-w-[75%] shadow-lg border border-blue-400/30">
                    <div class="text-sm">${textOrHtml}</div>
                    <div class="flex items-center justify-end space-x-1 mt-1 text-[10px] text-blue-200">
                        <span>${time}</span>
                        <i class="fa-solid fa-check-double text-cyan-300"></i>
                    </div>
                </div>
            `;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
            if (saveToStorage) saveChatHistoryState();
        }

        function saveChatHistoryState() {
            localStorage.setItem('biswa_chat_html', chatContainer.innerHTML);
            localStorage.setItem('biswa_current_screen', currentScreen);
        }

        function restoreChatHistoryState() {
            const savedHtml = localStorage.getItem('biswa_chat_html');
            const savedScreen = localStorage.getItem('biswa_current_screen');
            if (savedHtml && savedScreen) {
                chatContainer.innerHTML = savedHtml;
                currentScreen = savedScreen;
                if (currentScreen !== 'welcome' && currentScreen !== 'main_menu') {
                    document.getElementById('back-btn').classList.remove('hidden');
                }
                scrollToBottom();
                return true;
            }
            return false;
        }

        function showTypingAndTransition(callback) {
            const typingEl = document.getElementById('typing-indicator-container');
            typingEl.classList.remove('hidden');
            scrollToBottom();

            setTimeout(() => {
                typingEl.classList.add('hidden');
                callback();
            }, 350);
        }

        function navigateTo(screenName, userActionText = null, pushHistory = true) {
            playTgSound('screen');
            initAudio();

            if (pushHistory && currentScreen && currentScreen !== 'welcome' && currentScreen !== screenName) {
                navigationHistory.push(currentScreen);
            }
            currentScreen = screenName;

            const backBtn = document.getElementById('back-btn');
            if (screenName === 'welcome' || screenName === 'main_menu') {
                backBtn.classList.add('hidden');
                navigationHistory = [];
            } else {
                backBtn.classList.remove('hidden');
            }

            showTypingAndTransition(() => {
                if (userActionText) {
                    appendUserMessage(userActionText);
                }
                renderScreenContent(screenName);
            });
        }

        function handleBackClick() {
            playTgSound('click');
            if (navigationHistory.length > 0) {
                const prevScreen = navigationHistory.pop();
                navigateTo(prevScreen, "⬅️ Back", false);
            } else {
                navigateTo('main_menu', "🏠 Main Menu", false);
            }
        }

        function renderScreenContent(screenName) {
            if (screenName !== 'payment' && qrTimerInterval) {
                clearInterval(qrTimerInterval);
                qrTimerInterval = null;
            }

            switch(screenName) {
                case 'welcome': renderWelcomeScreen(); break;
                case 'main_menu': renderMainMenuScreen(); break;
                case 'shop_devices': renderShopDevicesScreen(); break;
                case 'shop_products': renderShopProductsScreen(); break;
                case 'product_detail': renderProductDetailScreen(); break;
                case 'payment': renderPaymentScreen(); break;
                case 'verification_waiting': renderVerificationWaitingScreen(); break;
                case 'my_orders': renderMyOrdersScreen(); break;
                case 'contact_owner': renderContactOwnerScreen(); break;
                case 'share_store': renderShareStoreScreen(); break;
                default: renderMainMenuScreen();
            }
        }

        function renderWelcomeScreen() {
            const welcomeHtml = `
                <div class="text-center space-y-3">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 flex items-center justify-center shadow-xl shadow-blue-500/30 animate-border-glow border border-blue-400/30">
                        <i class="fa-solid fa-store text-2xl text-white"></i>
                    </div>

        function addRipple(event) {
            const btn = event.currentTarget;
            const circle = document.createElement('span');
            const diameter = Math.max(btn.clientWidth, btn.clientHeight);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - btn.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${event.clientY - btn.getBoundingClientRect().top - radius}px`;
            circle.classList.add('ripple-effect');
            const ripple = btn.getElementsByClassName('ripple-effect')[0];
            if (ripple) ripple.remove();
            btn.appendChild(circle);
        }
