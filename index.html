        /* 
           APPLICATION STATE & ROUTING MANAGER
        */
        class TelegramStoreApp {
            constructor() {
                this.historyStack = [];
                this.currentScreen = 'welcome';
                this.selectedProduct = null;
                this.selectedDuration = null;
                this.selectedPrice = null;
                this.currentUser = null;
                
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        this.currentUser = user;
                        document.getElementById('auth-status-indicator').innerHTML = `<i class="fa-solid fa-shield-halved text-emerald-400"></i> Connected`;
                    }
                });

                this.initApp();
            }

            initApp() {
                this.navigateTo('welcome', false);
            }

            showTyping(callback) {
                const indicator = document.getElementById('typing-indicator');
                indicator.classList.remove('hidden');
                const viewport = document.getElementById('chat-viewport');
                viewport.scrollTop = viewport.scrollHeight;
                setTimeout(() => {
                    indicator.classList.add('hidden');
                    if (callback) callback();
                }, 400);
            }

            navigateTo(screenName, pushToHistory = true, data = {}) {
                if (pushToHistory && this.currentScreen && this.currentScreen !== 'welcome') {
                    this.historyStack.push({ screen: this.currentScreen, data: { ...data } });
                }
                
                this.currentScreen = screenName;
                
                // Manage Back button visibility
                const backBtn = document.getElementById('back-btn');
                if (screenName === 'welcome') {
                    backBtn.classList.add('hidden');
                } else {
                    backBtn.classList.remove('hidden');
                }

                this.showTyping(() => {
                    const viewport = document.getElementById('chat-viewport');
                    viewport.innerHTML = ''; // Completely remove previous conversation
                    
                    const screenContainer = document.createElement('div');
                    screenContainer.className = 'flex flex-col space-y-3 animate-slide-up w-full max-w-lg mx-auto pb-6';
                    
                    switch (screenName) {
                        case 'welcome':
                            screenContainer.innerHTML = this.renderWelcomeScreen();
                            break;
                        case 'main_menu':
                            screenContainer.innerHTML = this.renderMainMenu();
                            break;
                        case 'contact_owner':
                            screenContainer.innerHTML = this.renderContactOwner();
                            break;
                        case 'shop_products':
                            screenContainer.innerHTML = this.renderShopProducts();
                            break;
                        case 'android_panel_list':
                            screenContainer.innerHTML = this.renderAndroidPanelList();
                            break;
                        case 'product_detail_biswa':
                            screenContainer.innerHTML = this.renderBiswaModsProDetail();
                            break;
                        case 'product_detail_dragon':
                            screenContainer.innerHTML = this.renderDragonPanelDetail();
                            break;
                        case 'product_detail_immortal':
                            screenContainer.innerHTML = this.renderImmortalPanelDetail();
                            break;
                        case 'payment_screen':
                            screenContainer.innerHTML = this.renderPaymentScreen();
                            this.initPaymentQR();
                            this.initCountdownTimer();
                            break;
                        case 'my_orders':
                            screenContainer.innerHTML = this.renderMyOrders();
                            this.fetchAndRenderOrders();
                            break;
                    }

                    viewport.appendChild(screenContainer);
                    viewport.scrollTop = viewport.scrollHeight;
                });
            }

            goBack() {
                if (this.historyStack.length > 0) {
                    const previousState = this.historyStack.pop();
                    this.navigateTo(previousState.screen, false, previousState.data);
                } else {
                    this.navigateTo('main_menu', false);
                }
            }

            /* 
               ACTION HANDLERS & FIREBASE INTEGRATIONS
            */

            selectProduct(productName, detailScreen) {
                this.selectedProduct = productName;
                this.navigateTo(detailScreen);
            }

            proceedToPayment(productDesc, price) {
                this.selectedProduct = productDesc;
                this.selectedPrice = price;
                this.navigateTo('payment_screen');
            }

            initPaymentQR() {
                // Try loading QR from Firebase Settings if configured
                try {
                    db.ref('settings/qr_code_url').once('value')
                        .then((snapshot) => {
                            const qrUrl = snapshot.val();
                            if (qrUrl) {
                                const imgElem = document.getElementById('dynamic-qr-img');
                                const downloadLink = document.getElementById('download-qr-link');
                                if (imgElem) imgElem.src = qrUrl;
                                if (downloadLink) {
                                    downloadLink.href = qrUrl;
                                    downloadLink.setAttribute('target', '_blank');
                                }
                            }
                        })
                        .catch(() => {
                            // Fallback gracefully to local qr_code.png
                        });
                } catch (e) {
                    console.log("Using local QR fallback.");
                }
            }

            initCountdownTimer() {
                let timeLeft = 300; // 5 minutes in seconds
                const timerElem = document.getElementById('countdown-timer');
                if (!timerElem) return;

                const interval = setInterval(() => {
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerElem.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    timeLeft--;
                    if (timeLeft < 0) {
                        clearInterval(interval);
                        timerElem.textContent = "Expired";
                    }
                }, 1000);
            }

            handleScreenshotUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const viewport = document.getElementById('chat-viewport');
                
                // Show loading indicator in chat
                const loadingBubble = document.createElement('div');
                loadingBubble.className = 'flex items-start justify-end space-x-2 animate-fade-in pr-2';
                loadingBubble.innerHTML = `
                    <div class="telegram-bubble-out p-3 text-xs text-white max-w-[85%] border border-[#2481cc]/30 flex items-center gap-2">
                        <i class="fa-solid fa-spinner fa-spin"></i> Uploading payment screenshot & creating order...
                    </div>
                `;
                viewport.appendChild(loadingBubble);
                viewport.scrollTop = viewport.scrollHeight;

                const uid = this.currentUser ? this.currentUser.uid : 'anonymous_user';
                const orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
                const timestamp = Date.now();
                const storageRef = storage.ref().child(`payment_screenshots/${uid}/${orderId}_${file.name}`);

                storageRef.put(file)
                    .then((snapshot) => snapshot.ref.getDownloadURL())
                    .then((downloadURL) => {
                        const orderData = {
                            orderId: orderId,
                            customerUID: uid,
                            customerName: this.currentUser && this.currentUser.displayName ? this.currentUser.displayName : 'Telegram User',
                            gameUID: 'N/A',
                            product: this.selectedProduct,
                            duration: this.selectedProduct,
                            price: this.selectedPrice,
                            screenshotURL: downloadURL,
                            status: 'Pending',
                            createdDate: new Date().toLocaleDateString(),
                            timestamp: timestamp,
                            paymentProof: downloadURL
                        };

                        return db.ref(`orders/${uid}/${orderId}`).set(orderData);
                    })
                    .then(() => {
                        this.navigateTo('my_orders');
                    })
                    .catch((error) => {
                        alert("Error uploading screenshot: " + error.message);
                        this.navigateTo('main_menu');
                    });
            }

            fetchAndRenderOrders() {
                const container = document.getElementById('orders-list-container');
                if (!container) return;

                const uid = this.currentUser ? this.currentUser.uid : 'anonymous_user';
                
                db.ref(`orders/${uid}`).once('value')
                    .then((snapshot) => {
                        container.innerHTML = '';
                        const orders = snapshot.val();

                        if (!orders) {
                            container.innerHTML = `
                                <div class="telegram-bubble-in p-4 text-center text-sm text-[#8593a7] border border-[#232e3c]">
                                    <i class="fa-solid fa-box-open text-2xl mb-2 text-cyan-400"></i>
                                    <p>No Orders Found</p>
                                </div>
                            `;
                            return;
                        }

                        Object.values(orders).reverse().forEach((order) => {
                            let statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/30">Pending Badge</span>`;
                            let extraDetails = '';

                            if (order.status === 'Approved' || order.status === 'Completed') {
                                statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Approved</span>`;
                                extraDetails = `
                                    <div class="mt-2 pt-2 border-t border-[#232e3c] space-y-1">
                                        <p class="text-xs text-cyan-300 font-mono">License Key: <strong class="text-white">${order.licenseKey || 'BISWA-KEY-XXXX-YYYY'}</strong></p>
                                        <a href="${order.apkDownloadURL || '#'}" target="_blank" class="mt-1 block text-center py-1.5 px-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-medium transition-all">
                                            <i class="fa-solid fa-download"></i> APK Download Button
                                        </a>
                                    </div>
                                `;
                            } else if (order.status === 'Rejected') {
                                statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-red-500/20 text-red-400 border border-red-500/30">Rejected</span>`;
                                extraDetails = `<p class="text-xs text-red-400 mt-1">Reject Reason: ${order.rejectReason || 'Invalid payment screenshot or incorrect amount.'}</p>`;
                            }

                            const orderCard = document.createElement('div');
                            orderCard.className = 'telegram-bubble-in p-4 text-sm text-[#f5f5f5] border border-[#232e3c] space-y-2';
                            orderCard.innerHTML = `
                                <div class="flex items-center justify-between border-b border-[#232e3c] pb-2">
                                    <span class="font-bold text-cyan-300 text-xs font-mono">${order.orderId}</span>
                                    ${statusBadge}
                                </div>
                                <div class="space-y-1 text-xs text-slate-300">
                                    <p><strong class="text-white">${order.product}</strong></p>
                                    <p class="text-emerald-400 font-semibold">Price: ₹${order.price}</p>
                                    <p class="text-[#8593a7]">Order Date: ${order.createdDate}</p>
                                </div>
                                ${extraDetails}
                            `;
                            container.appendChild(orderCard);
                        });
                    })
                    .catch((error) => {
                        container.innerHTML = `<div class="text-xs text-red-400 p-2">Error loading orders: ${error.message}</div>`;
                    });
            }

            shareStore() {
                const currentUrl = window.location.href;
                navigator.clipboard.writeText(currentUrl).then(() => {
                    const viewport = document.getElementById('chat-viewport');
                    const toast = document.createElement('div');
                    toast.className = 'flex items-start space-x-2 animate-fade-in';
                    toast.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-[#2481cc] flex items-center justify-center text-white shrink-0 shadow">
                            <i class="fa-solid fa-robot text-xs"></i>
                        </div>
                        <div class="telegram-bubble-in p-4 text-sm text-[#f5f5f5] max-w-[85%] space-y-2 border border-[#232e3c]">
                            <p class="font-bold text-emerald-400">✅ Link Copied</p>
                            <p class="text-xs">Apne Friends ke saath ye Store Link share kare.</p>
                            <p class="text-xs text-[#8593a7]">Jab bhi koi customer aapke referral link se product purchase karega, aapko har successful order par discount milega.</p>
                        </div>
                    `;
                    viewport.appendChild(toast);
                    viewport.scrollTop = viewport.scrollHeight;
                });
            }
        }

        // Initialize Application instance on window load
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new TelegramStoreApp();
        });
    </script>
