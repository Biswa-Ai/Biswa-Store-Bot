    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #080c12;
            color: #f5f5f5;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(46, 166, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(46, 166, 255, 0.6);
        }

        /* Glassmorphism & Cyber Glow Effects */
        .glass-panel {
            background: rgba(23, 33, 43, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(46, 166, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-card {
            background: rgba(18, 26, 36, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(46, 166, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(46, 166, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(46, 166, 255, 0.6);
            box-shadow: 0 6px 25px rgba(46, 166, 255, 0.2), inset 0 0 15px rgba(46, 166, 255, 0.1);
        }

        /* Animated Glowing Borders */
        @keyframes borderGlow {
            0% { border-color: rgba(46, 166, 255, 0.3); box-shadow: 0 0 5px rgba(46, 166, 255, 0.1); }
            50% { border-color: rgba(46, 166, 255, 0.8); box-shadow: 0 0 15px rgba(46, 166, 255, 0.4); }
            100% { border-color: rgba(46, 166, 255, 0.3); box-shadow: 0 0 5px rgba(46, 166, 255, 0.1); }
        }
        .animate-border-glow {
            animation: borderGlow 3s infinite ease-in-out;
        }

        /* Ripple Effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Telegram Typing Dots */
        .typing-dot {
            width: 7px;
            height: 7px;
            background: #2ea6ff;
            border-radius: 50%;
            display: inline-block;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Message Entrance Animations */
        @keyframes msgSlideIn {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-animate {
            animation: msgSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* QR Pulse Animation */
        @keyframes qrPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 166, 255, 0.4); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 10px rgba(46, 166, 255, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 166, 255, 0); }
        }
        .qr-pulse {
            animation: qrPulse 2.5s infinite;
        }
    </style>

        // --- 2. AUDIO SYNTHESIZER (WEB AUDIO API) ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTgSound(type = 'click') {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                const now = audioCtx.currentTime;
                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'screen') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                }
            } catch (e) {

        function showTypingAndTransition(callback) {
            const typingEl = document.getElementById('typing-indicator-container');
            typingEl.classList.remove('hidden');
            scrollToBottom();

            const delay = Math.floor(Math.random() * 300) + 500; // 500-800ms
            setTimeout(() => {
                typingEl.classList.add('hidden');
                callback();
            }, delay);
        }

        function clearChatDOMCompletely() {
            chatContainer.innerHTML = '';

        // --- 6. SCREEN CONTROLLER & ROUTING ---
        function navigateTo(screenName, userActionText = null, pushHistory = true) {
            playTgSound('screen');
            initAudio();

            if (pushHistory && currentScreen && currentScreen !== 'welcome') {
                navigationHistory.push(currentScreen);
            }
            currentScreen = screenName;

            // Manage Back Button visibility
            const backBtn = document.getElementById('back-btn');
            if (screenName === 'welcome') {
                backBtn.classList.add('hidden');
                navigationHistory = [];
            } else {
                backBtn.classList.remove('hidden');
            }

            showTypingAndTransition(() => {
                if (userActionText) {
                    appendUserMessage(userActionText);
                }
                renderScreenContent(screenName);
            });
        }

        function handleBackClick() {
            playTgSound('click');
            if (navigationHistory.length > 0) {
                const prevScreen = navigationHistory.pop();
                navigateTo(prevScreen, "⬅️ Back", false);
            } else {
                navigateTo('welcome', "🏠 Main Menu", false);
            }
        }

        function renderScreenContent(screenName) {
            // Stop QR timer if navigating away from payment
            if (screenName !== 'payment' && qrTimerInterval) {
                clearInterval(qrTimerInterval);
                qrTimerInterval = null;
            }

            switch(screenName) {

                case 'contact_owner':
                    renderContactOwnerScreen();
                    break;
                case 'share_store':
                    renderShareStoreScreen();
                    break;
                default:
                    renderWelcomeScreen();
            }
        }

                            class="ripple w-full py-3 px-4 rounded-xl glass-card flex items-center justify-between text-left text-white font-medium text-xs hover:border-blue-400 transition-all">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 rounded-lg bg-cyan-500/20 text-cyan-400 flex items-center justify-center"><i class="fa-brands fa-whatsapp"></i></div>

        function startQrCountdown() {
            if (qrTimerInterval) clearInterval(qrTimerInterval);
            qrTimerInterval = setInterval(() => {
                qrSecondsRemaining--;
                const mins = Math.floor(qrSecondsRemaining / 60).toString().padStart(2, '0');
                const secs = (qrSecondsRemaining % 60).toString().padStart(2, '0');
                const timerEl = document.getElementById('qr-timer-display');
                if (timerEl) {
                    timerEl.innerText = `${mins}:${secs}`;
                }

                if (qrSecondsRemaining <= 0) {
                    clearInterval(qrTimerInterval);
                    qrTimerInterval = null;
                    handleQrExpiration();
                }
            }, 1000);
        }

        function handleQrExpiration() {
            playTgSound('click');
            const wrapper = document.getElementById('payment-session-wrapper');
            if (wrapper) {
                wrapper.innerHTML = `

        function fetchFirebaseQrSetting() {

        function triggerClearChat() {
            playTgSound('click');
            if (confirm("Are you sure you want to clear chat and reset session variables?")) {
                // Clear state variables
                selectedProductData = null;
                selectedDurationData = null;
                if (qrTimerInterval) {
                    clearInterval(qrTimerInterval);
                    qrTimerInterval = null;
                }

                clearChatDOMCompletely();
                showGlobalLoader("Clearing Chat...");
                setTimeout(() => {
                    hideGlobalLoader();
                    playTgSound('success');
                    appendBotMessage(`<div class="text-center py-2 text-xs text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check"></i> Chat Cleared Successfully. Returning to Main Menu...</div>`);
                    setTimeout(() => {
                        navigateTo('main_menu', null, false);
                    }, 800);
                }, 400);
            }
        }

        // --- 14. GLOBAL LOADER HELPERS ---
        function showGlobalLoader(text = "Processing...") {
            const loader = document.getElementById('global-loader');
            const textEl = document.getElementById('loader-text');
            if (textEl) textEl.innerText = text;
            if (loader) loader.classList.remove('hidden');
        }

        function hideGlobalLoader() {
            const loader = document.getElementById('global-loader');
            if (loader) loader.classList.add('hidden');
        }

        // --- 15. RIPPLE ANIMATION HELPER ---
        function addRipple(event) {
            const btn = event.currentTarget;
            const circle = document.createElement('span');
            const diameter = Math.max(btn.clientWidth, btn.clientHeight);
            const radius = diameter / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - btn.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${event.clientY - btn.getBoundingClientRect().top - radius}px`;
            circle.classList.add('ripple-effect');

            const ripple = btn.getElementsByClassName('ripple-effect')[0];
            if (ripple) {
                ripple.remove();
            }

            btn.appendChild(circle);
        }

        // --- 16. INITIAL APP BOOTSTRAP ---
        window.addEventListener('DOMContentLoaded', () => {
            initializeFirebaseSession();
            // Start directly on Welcome Screen as specified
            navigateTo('welcome', null, false);
        });
    </script>
</body>
</html>
